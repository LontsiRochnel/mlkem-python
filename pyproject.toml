[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlkem-python"
version = "0.1.0"
description = "Implémentation pédagogique de ML-KEM (FIPS 203) et K-PKE en Python pur"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["mlkem"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
