<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encapsuler | ML-KEM</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <a href="/index.html" class="home-link">Accueil</a>
        </div>
        <a href="/account.html" class="top-link account-button">Account</a>
      </header>

      <section class="panel">
        <h1>2. Encapsulation</h1>

        <div class="field">
          <label for="encaps-pubkey">Clé publique Alice</label>
          <textarea id="encaps-pubkey" rows="6" placeholder="ek base64"></textarea>
        </div>

        <div class="actions">
          <button id="encapsulate">Encapsuler</button>
        </div>

        <div class="field">
          <label for="ciphertext">Chiffre texte</label>
          <textarea id="ciphertext" rows="6" placeholder="c (base64)"></textarea>
        </div>

        <div class="field">
          <label for="shared-secret-a">Secret partagé (Alice)</label>
          <textarea id="shared-secret-a" rows="4" placeholder="K_A"></textarea>
        </div>

        <div class="inline-actions">
          <a href="/generate.html" class="home-link">Retour</a>
          <a href="/decapsulate.html" class="top-link">Suivant</a>
        </div>
      </section>
    </main>

    <script src="/js/base64.js?v=20261109"></script>
    <script src="/js/storage.js?v=20261109"></script>
    <script type="module" src="/js/api.js?v=20261109"></script>
    <script src="/js/ui.js?v=20261109"></script>
    <script src="/js/app.js?v=20261109"></script>
  </body>
</html>
