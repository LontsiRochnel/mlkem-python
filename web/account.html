<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | ML-KEM</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <a href="/index.html" class="home-link">Accueil</a>
        </div>
        <a href="/index.html" class="top-link account-button">Account</a>
      </header>

      <section class="panel">
        <h1>Session actuelle</h1>
        <p>Les données ci-dessous sont conservées dans la session du navigateur.</p>

        <div class="account-summary">
          <div class="account-box">
            <h3>Clés enregistrées</h3>
            <pre id="account-keys">Aucune clé.</pre>
          </div>
          <div class="account-box">
            <h3>Historique</h3>
            <ul id="account-history" class="history-list"></ul>
          </div>
        </div>

        <div class="inline-actions">
          <a href="/index.html" class="home-link">Retour à l’accueil</a>
        </div>
      </section>
    </main>

    <script src="/js/storage.js"></script>
    <script src="/js/account.js"></script>
  </body>
</html>
