<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générer des clés | ML-KEM</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <a href="/index.html" class="home-link">Accueil</a>
        </div>
        <a href="/account.html" class="top-link account-button">Account</a>
      </header>

      <section class="panel">
        <h1>1. Génération des clés</h1>
        <label for="variant-select">Variantes</label>
        <select id="variant-select"></select>
        <div class="actions">
          <button id="generate-keys">Générer les clés</button>
        </div>

        <div class="field">
          <label for="public-key">Clé publique</label>
          <textarea id="public-key" rows="6" placeholder="ek (base64)"></textarea>
        </div>

        <div class="field">
          <label for="private-key">Clé privée</label>
          <textarea id="private-key" rows="6" placeholder="dk (base64)"></textarea>
        </div>

        <div class="inline-actions">
          <a href="/index.html" class="home-link">Retour</a>
          <a href="/encapsulate.html" class="top-link">Suivant</a>
        </div>
      </section>
    </main>

    <script src="/js/base64.js?v=20261109"></script>
    <script src="/js/storage.js?v=20261109"></script>
    <script type="module" src="/js/api.js?v=20261109"></script>
    <script src="/js/ui.js?v=20261109"></script>
    <script src="/js/app.js?v=20261109"></script>
  </body>
</html>
